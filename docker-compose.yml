services:
  app:
    build: ./.docker/php
    image: php8.2-apache:kakeibo
    volumes:
      - ./.docker/php/php.ini:/usr/local/etc/php/php.ini:cached
      - ./.docker/php/000-default.conf:/etc/apache2/sites-enabled/000-default.conf:cached
      - ./:/var/www/html:delegated
    depends_on:
      - mysql
    ports:
      - 8080:80
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - mysql
    ports:
      - 4040:80
    volumes:
      - ./.docker/data/phpmyadmin/sessions:/sessions
  mysql:
    image: mysql:5.6
    volumes:
      - ./.docker/data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
